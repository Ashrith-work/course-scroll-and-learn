<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Scroll and Learn</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="logo">📚 Scroll &amp; Learn</span>
      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search courses…"
        aria-label="Search courses"
        autocomplete="off"
      />
      <select id="sort" class="sort" aria-label="Sort courses">
        <option value="id:asc">Oldest first</option>
        <option value="id:desc">Newest first</option>
        <option value="title:asc">Title A–Z</option>
        <option value="title:desc">Title Z–A</option>
      </select>
    </header>

    <main id="feed" class="feed" aria-live="polite">
      <!-- Course cards are injected here by app.js -->
    </main>

    <div id="hint" class="hint">Scroll to explore ↓</div>

    <button id="fab" class="fab" title="New course" aria-label="New course">＋</button>

    <dialog id="modal" class="modal">
      <form id="modal-form">
        <h3 id="modal-title">New course</h3>
        <div id="modal-fields"></div>
        <p id="modal-error" class="modal-error" hidden></p>
        <menu class="modal-actions">
          <button type="button" id="modal-cancel" class="btn-ghost">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </menu>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
